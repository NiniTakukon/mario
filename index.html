<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超级水管工 · SUPER PLUMBER</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0f1c;
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  #wrap { text-align: center; }
  #gameStage {
    position: relative;
    width: min(96vw, 154vh);
    margin: 0 auto;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    width: 100%;
    height: auto;
    border: 4px solid #2a3450;
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    background: #6fb8f0;
    touch-action: manipulation;
  }
  #startPrompt {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(76%, 320px);
    padding: 16px 18px 14px;
    border: 2px solid #ffd800;
    border-radius: 8px;
    color: #ffffff;
    background: rgba(11, 15, 28, .88);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #startPrompt[hidden] { display: none; }
  #startPrompt:hover, #startPrompt:focus-visible {
    background: rgba(28, 38, 66, .94);
    outline: 2px solid #ffffff;
    outline-offset: 3px;
  }
  #startPromptLabel {
    display: block;
    color: #ffd800;
    font-size: clamp(18px, 3vw, 26px);
    font-weight: bold;
    line-height: 1.3;
  }
  #startPromptHint {
    display: block;
    margin-top: 7px;
    color: #c6d5f0;
    font-size: 13px;
    line-height: 1.5;
  }
  .hint {
    color: #8fa2c8; font-size: 13px; margin-top: 12px; line-height: 1.8;
  }
  .hint b { color: #ffd800; font-weight: normal; }
</style>
</head>
<body>
<div id="wrap">
  <div id="gameStage">
    <canvas id="game" width="960" height="576" aria-label="超级水管工游戏画布"></canvas>
    <button id="startPrompt" type="button" aria-label="点击开始游戏">
      <span id="startPromptLabel">点击开始游戏</span>
      <span id="startPromptHint">也可以按 Enter 或空格键</span>
    </button>
  </div>
  <div class="hint">
    <b>← →</b> 移动 &nbsp;·&nbsp; <b>空格 / Z / ↑</b> 跳跃（长按跳更高）&nbsp;·&nbsp; <b>Shift / X</b> 加速跑<br>
    <b>F / L</b> 发射火球 &nbsp;·&nbsp; <b>↓ + 跳</b> 穿过木桥 &nbsp;·&nbsp; <b>P</b> 暂停 &nbsp;·&nbsp; <b>M</b> 静音<br>
    踩敌人得分 · 顶 <b>?</b> 块吃道具 · 100 金币奖 1 条命 · 冲上旗杆过关
  </div>
</div>
<script src="mario.js"></script>
</body>
</html>
